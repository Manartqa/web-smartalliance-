# nginx site for www.smartalliance.co.th on the central nginx host.
#
#   internet ─▶ FortiGate (NAT 80/443, no TLS) ─▶ this nginx (TLS) ─▶ 172.22.22.201:3000
#
# Install: /etc/nginx/sites-available/smartalliance.conf, symlinked from
# sites-enabled (or /etc/nginx/conf.d/ on a layout without sites-*).
# Walkthrough and checks: DEPLOYMENT-ONPREM.md.

# Port 80: ACME challenges for certificate renewal, everything else to https.
# The app does not redirect to https itself.
server {
	listen 80;
	listen [::]:80;
	server_name www.smartalliance.co.th smartalliance.co.th;

	location /.well-known/acme-challenge/ {
		root /var/www/letsencrypt;
	}

	location / {
		return 301 https://$host$request_uri;
	}
}

server {
	listen 443 ssl;
	listen [::]:443 ssl;
	# Both names, so the bare domain reaches the app — which answers it with a
	# 308 to www (next.config.ts). That redirect keys on Host, hence
	# `proxy_set_header Host $host` below.
	server_name www.smartalliance.co.th smartalliance.co.th;

	# Must cover both names. Let's Encrypt paths shown; point these at a
	# purchased certificate instead if that is what the host uses.
	ssl_certificate     /etc/letsencrypt/live/www.smartalliance.co.th/fullchain.pem;
	ssl_certificate_key /etc/letsencrypt/live/www.smartalliance.co.th/privkey.pem;

	# Next streams HTML; buffering it delays first paint for no gain.
	proxy_buffering off;
	client_max_body_size 2m;

	location / {
		proxy_pass http://172.22.22.201:3000;
		proxy_http_version 1.1;
		proxy_set_header Host $host;
		# OVERWRITE, never $proxy_add_x_forwarded_for. The app's rate limiter
		# (src/lib/rate-limit.ts) keys on the left-most entry when
		# TRUST_PROXY=1; appending would let a client choose that entry itself.
		proxy_set_header X-Forwarded-For $remote_addr;
		proxy_set_header X-Real-IP $remote_addr;
		proxy_set_header X-Forwarded-Proto $scheme;
		proxy_read_timeout 30s;
	}
}
