name: Deploy to Azure App Service

# `main` is the only branch that reaches production. Everything else arrives
# through a pull request, which ci.yml gates.
on:
  push:
    branches: [main]
  # Manual re-run, for redeploying the current main without a new commit.
  workflow_dispatch:

# One deploy at a time. Without this, two merges landing close together race
# each other onto the same site and the older build can win.
concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Re-runs lint, types and tests against the exact commit on main. A PR check
  # verified the PR's head; this verifies what is actually about to ship.
  verify:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Build and deploy
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Bind to the GitHub environment so its protection rules (required
    # reviewers, wait timer) apply, and so the deployed URL shows on the run.
    # NOTE: this also decides the OIDC subject Azure must trust —
    # `repo:<owner>/<repo>:environment:production`, not the branch ref.
    environment:
      name: production
      url: ${{ vars.NEXT_PUBLIC_SITE_URL }}

    permissions:
      # Required for OIDC: lets the job mint the token azure/login exchanges.
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      # ---------------------------------------------------------------------
      # NEXT_PUBLIC_* are inlined into the bundle at BUILD time. Setting them
      # as App Service application settings does nothing for these — by the
      # time the app starts, the values are already baked into the JS and into
      # the prerendered sitemap, robots.txt and canonical/hreflang tags.
      #
      # They must therefore be present HERE. They are public by definition, so
      # they live in GitHub *variables*, not secrets.
      # ---------------------------------------------------------------------
      - name: Build
        env:
          NODE_ENV: production
          NEXT_PUBLIC_SITE_URL: ${{ vars.NEXT_PUBLIC_SITE_URL }}
          NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION }}
          NEXT_PUBLIC_BING_SITE_VERIFICATION: ${{ vars.NEXT_PUBLIC_BING_SITE_VERIFICATION }}
        run: |
          if [ -z "$NEXT_PUBLIC_SITE_URL" ]; then
            echo "::error::NEXT_PUBLIC_SITE_URL is not set. Canonical URLs, hreflang, sitemap.xml and Open Graph would be built against the fallback in src/config/site.ts. Set it as a repository variable before deploying."
            exit 1
          fi
          npm run build

      # ---------------------------------------------------------------------
      # `output: "standalone"` traces only the modules the app reaches, but it
      # deliberately leaves out `.next/static` and `public` — Next assumes a CDN
      # serves them. Copy both in, or the site renders with no CSS, JS or images.
      #
      # `cp -a <dir>/.` and not `cp -r <dir>/*`: the standalone tree's own
      # `.next/` directory is a dotfile, and a `*` glob silently skips it. The
      # result boots and then fails with "Could not find a production build".
      # ---------------------------------------------------------------------
      - name: Package standalone server
        run: |
          mkdir -p deploy
          cp -a .next/standalone/. deploy/
          cp -a .next/static deploy/.next/static
          cp -a public deploy/public
          echo "Packaged $(du -sh deploy | cut -f1):"
          ls -a deploy

      - name: Verify the package can actually boot
        run: |
          # Catches a broken package here rather than as a restart loop on the
          # host. 503 is the expected answer from /api/contact with no mail
          # credentials present — it proves the route ran, not that mail works.
          cd deploy
          PORT=3100 NODE_ENV=production node server.js &
          SERVER_PID=$!
          for i in $(seq 1 20); do
            sleep 1
            curl -fsS -o /dev/null "http://127.0.0.1:3100/en" && break
            if [ "$i" = "20" ]; then echo "::error::Packaged server never became ready"; exit 1; fi
          done
          curl -fsS -o /dev/null "http://127.0.0.1:3100/en/services"
          curl -fsS -o /dev/null "http://127.0.0.1:3100/th/contact"
          curl -fsS -o /dev/null "http://127.0.0.1:3100/sitemap.xml"
          kill $SERVER_PID
          echo "Package boots and serves both locales."

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: deploy

      # A green deploy step only means the zip was accepted. This is the check
      # that the site is actually up and serving.
      - name: Smoke-test production
        run: |
          BASE="${{ vars.NEXT_PUBLIC_SITE_URL }}"
          for i in $(seq 1 15); do
            sleep 6
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -L "$BASE/en" || true)
            echo "attempt $i: GET $BASE/en -> $CODE"
            [ "$CODE" = "200" ] && break
            if [ "$i" = "15" ]; then
              echo "::error::Site did not return 200 after deploy. Check the log stream with: az webapp log tail --name <app> --resource-group <rg>"
              exit 1
            fi
          done
          curl -fsSL -o /dev/null "$BASE/th"
          curl -fsSL -o /dev/null "$BASE/en/services"
          echo "Production is serving."

      - name: Log out
        if: always()
        run: az logout || true
