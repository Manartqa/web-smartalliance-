services:
  web:
    # Built and exported on a workstation by scripts/deploy.ps1, then loaded on
    # the server with `docker load` — the same image the Azure VM runs. There is
    # no `build:` block on purpose: the server holds no source code, and
    # NEXT_PUBLIC_* are baked in at build time (DEPLOYMENT.md, "Build-time vs
    # runtime"), so building here would need every one of them repeated.
    image: smartalliance-web:latest
    container_name: smartalliance-web

    # Brings the site back after a crash and after a reboot, but stays down if
    # it was stopped deliberately.
    restart: unless-stopped

    # Mail credentials, reCAPTCHA secret and TRUST_PROXY. Read when the
    # container is created, so a change needs `docker compose up -d
    # --force-recreate`, not a restart.
    env_file:
      - .env.production

    # Bound to the server's LAN address, which the central nginx host proxies
    # to after terminating TLS (scripts/nginx/smartalliance.conf). Plain
    # "3000:3000" would also publish it on every other interface, including
    # docker0 and any address added later. Docker writes its own iptables rules
    # ahead of ufw, so ufw does not narrow who on the LAN can reach this — see
    # DEPLOYMENT-ONPREM.md, "Known caveats".
    ports:
      - "172.22.22.201:3000:3000"

    # A disk filled by container logs takes the site down in a way that is slow
    # to diagnose. Cap them.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    stop_grace_period: 20s
