services:
  web:
    build:
      context: .
      # NEXT_PUBLIC_* are baked into the bundle during `docker compose build`.
      # They are read from .env in this directory at build time — changing one
      # needs a rebuild, not a restart. Everything else is runtime, below.
      args:
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:?set NEXT_PUBLIC_SITE_URL in .env}
        NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION: ${NEXT_PUBLIC_GOOGLE_SITE_VERIFICATION:-}
        NEXT_PUBLIC_BING_SITE_VERIFICATION: ${NEXT_PUBLIC_BING_SITE_VERIFICATION:-}

    image: smartalliance-web:latest
    container_name: smartalliance-web

    # Replaces the systemd unit: brings the site back after a crash and after a
    # reboot, but stays down if it was stopped deliberately.
    restart: unless-stopped

    # Mail credentials and TRUST_PROXY. Read at container start, so a change
    # here needs only `docker compose up -d`, no rebuild.
    env_file:
      - .env.production

    # Bound to loopback ON THE HOST, so the container is reachable only through
    # nginx. Writing "3000:3000" instead would publish it on every interface,
    # including the public one — and Docker inserts its own iptables rules ahead
    # of ufw, so a host firewall would not stop it. (The Azure NSG still would,
    # since it is enforced outside the VM, but that leaves the app one NSG edit
    # away from being exposed with no TLS and no proxy in front of it.)
    ports:
      - "127.0.0.1:3000:3000"

    # A VM disk filled by container logs takes the site down in a way that is
    # slow to diagnose. Cap them.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

    # The image's HEALTHCHECK covers a process that is up but wedged; these are
    # the ordinary crash-and-restart guards.
    stop_grace_period: 20s
